spring:
  application:
    name: tradironi
  datasource:
    url: jdbc:h2:mem:tradironi_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        default_schema: tradironi_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: tradironi_schema
    default-schema: tradironi_schema
    create-schemas: true